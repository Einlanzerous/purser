# Purser service block for construct-server/docker-compose.yml.
#
# Paste this `purser:` service under the top-level `services:` key. It follows
# the house pattern (Switchyard / Lyceum): GHCR image, construct_net, depends on
# the shared Postgres, /healthz check, Watchtower opt-out (explicit deploys).
#
# Prerequisites (three coordinated edits in construct-server — see the Purser
# README "Deploying to construct-server"):
#   1. db/init-db.sh   : ensure_db purser_user "$PURSER_DB_PASSWORD" purser
#   2. postgres env     : add - PURSER_DB_PASSWORD=${PURSER_DB_PASSWORD}
#   3. .env / .env.example : PURSER_DB_PASSWORD, PURSER_SWITCHYARD_TOKEN,
#                            PURSER_LYCEUM_OWNER_TOKEN, ARGOSY_PROVISION_TOKEN,
#                            PURSER_CF_* , PURSER_SMTP_* , PURSER_API_TOKEN
# Then: docker compose up -d postgres && make db-init && docker compose up -d purser

  purser:
    image: ghcr.io/einlanzerous/purser:latest
    container_name: purser
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - PURSER_ADDR=:4006
      - PURSER_DATABASE_URL=postgres://purser_user:${PURSER_DB_PASSWORD}@postgres:5432/purser?sslmode=disable
      - PURSER_API_TOKEN=${PURSER_API_TOKEN}
      # Switchyard connector (create user + mint token)
      - PURSER_SWITCHYARD_BASE_URL=http://switchyard:4002
      - PURSER_SWITCHYARD_TOKEN=${PURSER_SWITCHYARD_TOKEN}
      - PURSER_SWITCHYARD_URL=https://switchyard.zerogravity.industries
      # Cloudflare Access connector (add to SSO). Optional: unset => manual step printed.
      - PURSER_CF_API_TOKEN=${PURSER_CF_API_TOKEN:-}
      - PURSER_CF_ACCOUNT_ID=${PURSER_CF_ACCOUNT_ID:-}
      - PURSER_CF_ACCESS_GROUP_ID=${PURSER_CF_ACCESS_GROUP_ID:-}
      - PURSER_CF_ACCESS_GROUP_NAME=zerogravity-members
      - PURSER_CF_TEAM_DOMAIN=zero-gravity-industries.cloudflareaccess.com
      # Service spin-up coordinates (PRSR-22). Unread until those connectors
      # exist; carried now so the env plumbing lands once. Unset changes nothing.
      # PURSER_CF_TUNNEL_ID is the same value as CLOUDFLARE_TUNNEL_ID.
      - PURSER_CF_ZONE_ID=${PURSER_CF_ZONE_ID:-}
      - PURSER_CF_TUNNEL_ID=${PURSER_CF_TUNNEL_ID:-}
      # App Launcher the credential block leads with (Access-granted invites
      # only). Defaults to https:// + the team domain above.
      - PURSER_LAUNCHER_URL=${PURSER_LAUNCHER_URL:-}
      # Lyceum connector (create user + mint invite). Needs an owner *session*
      # token — redeem a `lyceum mint-token` invite via POST /auth/session; a
      # LYCEUM_API_TOKENS entry can't reach /admin. The lyceum service must also
      # run with LYCEUM_AUTH=true. Unset => connector registers Unavailable.
      - PURSER_LYCEUM_BASE_URL=http://lyceum:4005
      - PURSER_LYCEUM_OWNER_TOKEN=${PURSER_LYCEUM_OWNER_TOKEN:-}
      - PURSER_LYCEUM_URL=https://lyceum.zerogravity.industries
      # Argosy connector (create account + return the one-time password). Must
      # match the argosy service's ARGOSY_PROVISION_TOKEN — argosy registers
      # POST /api/v1/admin/accounts only when that env is set. Unset here =>
      # connector registers Unavailable.
      - PURSER_ARGOSY_BASE_URL=http://argosy:8096
      - PURSER_ARGOSY_PROVISION_TOKEN=${ARGOSY_PROVISION_TOKEN:-}
      - PURSER_ARGOSY_URL=https://argosy.zerogravity.industries
      # Onboarding bundles (PRSR-12). Omitted => the built-in media/all sets.
      # Defining ANY PURSER_BUNDLE_* replaces the built-ins wholesale, so list
      # them all if you override. Bundles grant *:user on Switchyard projects by
      # default (project role, not instance role).
      - PURSER_DEFAULT_BUNDLE=${PURSER_DEFAULT_BUNDLE:-media}
      # Email delivery (optional)
      - PURSER_SMTP_HOST=${PURSER_SMTP_HOST:-}
      - PURSER_SMTP_PORT=${PURSER_SMTP_PORT:-587}
      - PURSER_SMTP_USERNAME=${PURSER_SMTP_USERNAME:-}
      - PURSER_SMTP_PASSWORD=${PURSER_SMTP_PASSWORD:-}
      - PURSER_SMTP_FROM=${PURSER_SMTP_FROM:-purser@zerogravity.industries}
    networks:
      - construct_net
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4006/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
