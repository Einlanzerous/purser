name: publish

# Builds the production image (deploy/Dockerfile) and pushes it to GHCR.
# construct-server pulls ghcr.io/einlanzerous/purser:latest. main publishes
# :latest; release-please tags (v*) publish the semver tags.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/einlanzerous/purser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity for /healthz (PRSR-32) — see deploy/Dockerfile.
          #
          # VERSION is passed ONLY on a tag build. On a push to main
          # `steps.meta.outputs.version` is `latest`, and `latest` names a
          # moving target rather than a build: it was already being linked into
          # the binary before this change and was harmless only because nothing
          # read it. Now that /healthz reports it, passing it through would have
          # purser claim to run a version called "latest" — stored as an
          # identity, compared against the image label, disagreeing for ever.
          # Blank instead, which `internal/version` maps to "dev".
          #
          # On a tag build metadata-action's `version` output is already the
          # BARE semver (`0.14.0`), matching the image label character for
          # character. That agreement is the whole point: the reconciler
          # observes this string and the deploy reporter reports the label, and
          # the matrix compares the two as identities.
          #
          # GIT_SHA is passed on both paths. A main build has a real commit and
          # should say so; it just has no release to name.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
